# Cloudflare Workers Builds の復元用。ファイルの編集だけではCloudflareの設定に反映されない。
# 本番はWorkerのSettings → Builds、今後作るPreviewのビルド設定はBuilds APIの
# previews_base_configで管理する。既存の固定Previewは個別のAPI設定 settings に反映する。
# Workerの実行時設定はwrangler.tomlに置く。
previews_enabled = true

[git_repository]
provider_type = "github"
provider_account_name = "eroccowaruico"
repo_name = "RideCom"
branch = "main"

[production_settings]
root_directory = "/server"
build_command = "npm ci"
deploy_command = "npx wrangler deploy"

[production_settings.environment_variables.SKIP_DEPENDENCY_INSTALL]
value = "1"
is_secret = false

[previews_base_config]
root_directory = "/server"
build_command = "npm ci"
deploy_command = "npx wrangler preview"

[previews_base_config.environment_variables.SKIP_DEPENDENCY_INSTALL]
value = "1"
is_secret = false

[fixed_preview]
branch = "preview"
auto_build = true
